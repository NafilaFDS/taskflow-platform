# Scenario B - B2/B3: app + MongoDB + Prometheus + Grafana
#
# Usage (from scenario-b/):
#   cp .env.example .env      # then set real passwords
#   docker compose up -d --build
#
# Experiment overrides for Tasks 26 and 28 live in docker/ and are layered on
# top of this file with extra -f flags. This file is the fixed configuration.

name: taskflow-b

services:
  app:
    build:
      context: ./app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3100}:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      MONGODB_URI: "mongodb://${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}@mongodb:27017/taskflow?authSource=admin"
      # Per-request time budget. Past it, no more DB queries run and the request
      # fails with 504 instead of holding MongoDB for minutes (B3 load tests).
      REQUEST_TIMEOUT_MS: "15000"
    # The app connects to MongoDB once at startup, so it must not start until
    # MongoDB actually answers queries - "container started" is not enough.
    depends_on:
      mongodb:
        condition: service_healthy
    mem_limit: 256m
    memswap_limit: 256m

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    # Not published to the host: only services on the compose network reach it.
    healthcheck:
      # ping needs no authentication. --host mongodb targets the container's
      # network interface, not loopback: on first boot the image runs a
      # temporary init mongod bound to 127.0.0.1 only, which would otherwise
      # report healthy before the real server is listening.
      test: ["CMD", "mongosh", "--quiet", "--host", "mongodb", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
      start_interval: 2s

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:
