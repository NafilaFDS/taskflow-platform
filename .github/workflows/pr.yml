# B5 Tasks 41 + 42 - Pull Request pipeline for the Scenario B notes API.
# EXAM_TOKEN: nafila-vmi3536696-1788314521-777773cb
#
# Task 41: runs on every Pull Request: test -> build image -> start container ->
# curl the running container's /healthz -> clean up. Any failing step fails
# the run, and the container is removed even when an earlier step fails.
#
# Task 42: the npm download cache (~/.npm) is saved and restored between runs,
# keyed on the hash of package-lock.json. `npm ci` reads from it, so a warm run
# installs from disk instead of downloading every tarball from the registry.

name: PR - test, build and health check

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-build-healthcheck:
    name: Test, build image, curl /healthz
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scenario-b/app

    env:
      # run_id keeps the name unique, so parallel or re-run jobs never collide.
      IMAGE: taskflow-scenario-b:pr-${{ github.run_id }}
      CONTAINER: taskflow-healthcheck-${{ github.run_id }}
      # 3000 is free on the runner; 3100 matches the port used locally.
      HOST_PORT: '3100'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js and restore the npm cache
        # id is what lets the next step read the cache-hit output.
        id: npm-cache
        uses: actions/setup-node@v5
        with:
          # Same major version as the Dockerfile's node:22-alpine base.
          node-version: '22'
          # B5 Task 42 - cache the npm download cache (~/.npm). The cache key is
          # built from the runner OS, the Node version and a hash of the file
          # named below, so any lockfile change invalidates it automatically.
          cache: npm
          cache-dependency-path: scenario-b/app/package-lock.json

      - name: Report npm cache status
        # cache-hit is 'true' when the cache was restored and empty when it was
        # not. Printed so the log itself proves whether this was a cold or a
        # warm run - the timings below are only meaningful next to it.
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ steps.npm-cache.outputs.cache-hit }}" = 'true' ]; then
            echo 'CACHE HIT  - warm run: ~/.npm was restored from the Actions cache.'
          else
            echo 'CACHE MISS - cold run: nothing cached for this lockfile yet.'
          fi
          cache_dir=$(npm config get cache)
          echo "npm cache dir: ${cache_dir}"
          du -sh "$cache_dir" 2>/dev/null || echo 'npm cache dir does not exist yet'

      - name: Install dependencies
        # npm ci installs exactly what the lockfile pins and fails if the
        # lockfile and package.json have drifted apart. It resolves tarballs
        # from the cache dir restored above, so a warm run makes no registry
        # download at all. Timed to make the cold/warm difference visible.
        run: |
          start=$SECONDS
          npm ci
          echo "npm ci finished in $(( SECONDS - start ))s"

      - name: Run tests
        # node --test, 4 tests. Exits non-zero on any failure, which fails the job.
        run: npm test

      - name: Build Docker image
        run: docker build -t "$IMAGE" .

      - name: Start the built image
        # MONGODB_URI is deliberately empty: there is no database in CI, and
        # /healthz reports the process, not the database.
        run: |
          docker run -d \
            --name "$CONTAINER" \
            -p "${HOST_PORT}:3000" \
            -e MONGODB_URI= \
            "$IMAGE"
          docker ps --filter "name=$CONTAINER"

      - name: Curl the running container's /healthz
        run: |
          code=''
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /tmp/healthz.json -w '%{http_code}' \
              "http://127.0.0.1:${HOST_PORT}/healthz" || true)
            if [ "$code" = "200" ]; then
              echo "HTTP 200 from /healthz after ${attempt} attempt(s):"
              cat /tmp/healthz.json; echo
              # Assert the body too: a 200 carrying the wrong payload is a failure.
              grep -q '"status":"ok"' /tmp/healthz.json
              exit 0
            fi
            sleep 1
          done
          echo "::error::/healthz did not return 200 within 30s (last status: '${code}')"
          echo '--- container logs ---'
          docker logs "$CONTAINER" || true
          exit 1

      - name: Clean up test container
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          docker image rm -f "$IMAGE" >/dev/null 2>&1 || true
          echo 'Test container and image removed.'
